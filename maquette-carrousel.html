<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette carrousel 3D · MaxiskApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap">
<style>
/* ═════ Thèmes ═════ */
:root{
  --bg:#0A0D14; --fg:#F1F5F9; --muted:#9AA4B8; --line:rgba(255,255,255,.14);
  --face1:#232B3D; --face2:#141A27; --face3:#10151F; --hi:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.9); --dock:rgba(255,255,255,.06); --dot:rgba(255,255,255,.3); --dotOn:#fff; --dim:#0A0D14;
}
:root[data-theme="light"]{
  --bg:#ECEEF4; --fg:#0F172A; --muted:#556079; --line:rgba(15,23,42,.08);
  --face1:#FFFFFF; --face2:#F7F8FB; --face3:#EEF0F5; --hi:rgba(255,255,255,.9);
  --shadow:rgba(30,41,80,.35); --dock:rgba(255,255,255,.75); --dot:rgba(15,23,42,.2); --dotOn:#0F172A; --dim:#ECEEF4;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#ECEEF4; --fg:#0F172A; --muted:#556079; --line:rgba(15,23,42,.08);
    --face1:#FFFFFF; --face2:#F7F8FB; --face3:#EEF0F5; --hi:rgba(255,255,255,.9);
    --shadow:rgba(30,41,80,.35); --dock:rgba(255,255,255,.75); --dot:rgba(15,23,42,.2); --dotOn:#0F172A; --dim:#ECEEF4;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 16px/1.5 "Open Sans",system-ui,sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;transition:background .3s,color .3s}
.app{height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 0 max(14px,env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-end;gap:10px;padding:8px 22px 0}
header div{flex:1}
header small{color:var(--muted);font-size:14px;font-weight:600}
header h1{margin:2px 0 0;font:700 30px/1.15 Poppins,sans-serif}
.theme{min-width:48px;height:48px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--dock);color:var(--fg);
  font:600 14px "Open Sans",sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer}
.theme svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{margin:6px 22px 0;color:var(--muted);font-size:13px}

/* ═════ Carrousel ═════
   Pas de preserve-3d sur l'anneau : chaque carte est dessinée à plat dans l'ordre (z-index),
   donc les cartes ne se coupent jamais quand elles se croisent. */
.stage{flex:1;position:relative;touch-action:pan-y;min-height:340px}
.ring{position:absolute;inset:0;perspective:1100px}
.card{position:absolute;left:50%;top:50%;width:216px;height:280px;margin:-150px 0 0 -108px;border-radius:30px;transform-style:preserve-3d;cursor:pointer;will-change:transform,opacity}
.face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:linear-gradient(160deg,var(--face1),var(--face2) 60%,var(--face3));border:1px solid var(--line);
  box-shadow:0 40px 60px -30px var(--shadow), inset 0 1px 0 var(--hi)}
.face::before{content:"";position:absolute;inset:-30%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.28;transform:translateY(-12%)}
.glare{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) 8%,rgba(255,255,255,.2),transparent 55%)}
.dimmer{position:absolute;inset:0;border-radius:inherit;background:var(--dim);opacity:0;pointer-events:none;transform:translateZ(70px)}
.logo{position:absolute;left:50%;top:44px;width:128px;height:128px;margin-left:-64px;transform:translateZ(60px);
  filter:drop-shadow(0 16px 14px rgba(0,0,0,.4))}
.logo img{width:100%;height:100%;display:block;object-fit:contain}
.logo img.sq{border-radius:23%}
.name{position:absolute;left:12px;right:12px;bottom:46px;text-align:center;transform:translateZ(36px);
  font:700 22px/1.2 Poppins,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{position:absolute;left:12px;right:12px;bottom:22px;text-align:center;transform:translateZ(24px);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::after{content:"";position:absolute;left:10%;right:10%;bottom:-30px;height:30px;border-radius:50%;
  background:radial-gradient(closest-side,var(--c),transparent);opacity:.45;transform:translateZ(-30px)}

.dots{display:flex;justify-content:center;gap:8px;margin:2px 0 12px}
.dots button{width:8px;height:8px;padding:0;border:none;border-radius:99px;background:var(--dot);transition:width .25s,background .25s;cursor:pointer}
.dots button[aria-current="true"]{width:24px;background:var(--dotOn)}

/* ═════ Barre du bas ═════ */
.dock{margin:0 14px;padding:12px 6px;border-radius:28px;background:var(--dock);border:1px solid var(--line);
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;box-shadow:0 10px 30px -18px var(--shadow)}
.dock::-webkit-scrollbar{display:none}
.it{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border-radius:18px;cursor:pointer;transition:transform .15s ease-out}
.it:active{transform:scale(.92)}
.it .ic{width:54px;height:54px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.it .ic img{width:100%;height:100%;display:block;object-fit:contain}
.it .ic img.sq{border-radius:23%}
.it span{max-width:72px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk{width:100%;height:100%;border-radius:23%;background:#F6EBDD;display:grid;place-items:center;color:var(--c)}
.pk svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><small id="today"></small><h1>MaxiskApp</h1></div>
    <button class="theme" id="theme" aria-label="Changer de thème"></button>
  </header>
  <p class="note">Maquette : glisse les cartes du doigt, penche le téléphone. Le bouton en haut change le thème.</p>
  <div class="stage" id="stage"><div class="ring" id="ring"></div></div>
  <div class="dots" id="dots"></div>
  <nav class="dock" id="dock" aria-label="Autres applis"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const P = "https://miamax6.github.io/";
const img = (src, sq) => `<img src="${src}" alt=""${sq ? ' class="sq"' : ""} draggable="false">`;
const RECEIPT = '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>';
const APPS = {
  budget:   { n:"Budget",         k:"Comptes du foyer",  c:"#2F6B82", ic:img(P + "mbauxdijsekta/icon.svg") },
  jungle:   { n:"Jungle",         k:"Plantes et graines", c:"#6B8E4E", ic:img(P + "your-tiny-jungle/icons/icon.svg") },
  yam:      { n:"Yam's",          k:"Feuille de score",  c:"#B0603F", ic:img(P + "yam-iamax/icon.svg") },
  ha:       { n:"Home Assistant", k:"Maison",            c:"#18BCF2", ic:img("logos/homeassistant.webp") },
  musiccast:{ n:"MusicCast",      k:"Son",               c:"#7B2D8E", ic:img("logos/musiccast.webp", true) },
  tricount: { n:"Tricount",       k:"Dépenses partagées", c:"#0F766E", ic:`<div class="pk" style="--c:#0F766E"><svg viewBox="0 0 24 24">${RECEIPT}</svg></div>` }
};
const FAVS = ["budget","jungle","yam","ha"].map(k => APPS[k]);
const OTHERS = ["musiccast","tricount","ha","yam"].map(k => APPS[k]);
const $ = s => document.querySelector(s);
const d = new Date().toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
$("#today").textContent = d.charAt(0).toUpperCase() + d.slice(1);
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1400); }

/* Thème : auto → clair → sombre */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
const AUTO = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>';
const THEMES = [["auto", AUTO + "Auto"], ["light", SUN + "Clair"], ["dark", MOON + "Sombre"]];
let th = 0; try { th = Math.max(0, THEMES.findIndex(t => t[0] === localStorage.getItem("maxisk.mq.theme"))); } catch(e){}
function paintTheme(){ document.documentElement.dataset.theme = THEMES[th][0]; $("#theme").innerHTML = THEMES[th][1]; try { localStorage.setItem("maxisk.mq.theme", THEMES[th][0]); } catch(e){} }
$("#theme").addEventListener("click", () => { th = (th + 1) % THEMES.length; paintTheme(); });
paintTheme();

/* Cartes */
const ring = $("#ring"), N = FAVS.length;
ring.innerHTML = FAVS.map((f, i) => `<div class="card" data-i="${i}" style="--c:${f.c}" role="button" aria-label="${f.n}">
  <div class="face"><div class="glare"></div></div><div class="logo">${f.ic}</div><div class="name">${f.n}</div><div class="kind">${f.k}</div><div class="dimmer"></div></div>`).join("");
const cards = [...ring.children], dims = cards.map(c => c.querySelector(".dimmer")), glares = cards.map(c => c.querySelector(".glare"));
$("#dots").innerHTML = FAVS.map(f => `<button aria-label="${f.n}"></button>`).join("");
const dots = [...$("#dots").children];
$("#dock").innerHTML = OTHERS.map(o => `<div class="it" role="button"><div class="ic">${o.ic}</div><span>${o.n}</span></div>`).join("");
$("#dock").addEventListener("click", e => { const it = e.target.closest(".it"); if (it) toast("Ouvrirait " + it.querySelector("span").textContent); });

/* ═════ Mouvement ═════
   pos = carte au centre (décimal pendant le geste).
   Relâché : approche amortie sans rebond (exponentielle), environ 300 ms. */
let pos = 0, target = 0, dragging = false, raf = 0, last = 0, gx = 0, gy = 0, tgx = 0, tgy = 0;
const wrap = x => ((x % N) + N) % N;
const ease = t => 1 - Math.pow(1 - t, 3);
function layout(){
  cards.forEach((c, i) => {
    let off = i - pos; off = ((off + N / 2) % N + N) % N - N / 2;      // boucle infinie
    const a = Math.max(-2, Math.min(2, off)), ab = Math.abs(a);
    const x = Math.sign(a) * (Math.min(ab, 1) * 150 + Math.max(0, ab - 1) * 70);   // linéaire : passage régulier entre deux cartes
    const z = -ab * 230, ry = -a * 32, sc = 1 - Math.min(ab, 1) * .08;
    c.style.transform = `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateX(${gy.toFixed(2)}deg) rotateY(${(ry + gx).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
    c.style.opacity = Math.max(0, Math.min(1, 1.6 - ab * .8)).toFixed(3);
    c.style.zIndex = 100 - Math.round(ab * 20);
    dims[i].style.opacity = (Math.min(ab, 1) * .35).toFixed(3);
    glares[i].style.setProperty("--mx", (50 + a * 25 + gx * 3).toFixed(0) + "%");
  });
  const cur = wrap(Math.round(pos));
  dots.forEach((b, i) => b.setAttribute("aria-current", i === cur));
}
function tick(t){
  const dt = Math.min(48, t - (last || t)); last = t;
  if (!dragging){
    pos += (target - pos) * (1 - Math.exp(-dt / 85));                 // amorti critique : pas de dépassement
    if (Math.abs(target - pos) < .0015) pos = target;
  }
  gx += (tgx - gx) * Math.min(1, dt / 90); gy += (tgy - gy) * Math.min(1, dt / 90);
  layout();
  if (dragging || pos !== target || Math.abs(tgx - gx) + Math.abs(tgy - gy) > .01) raf = requestAnimationFrame(tick);
  else { raf = 0; last = 0; }
}
const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };

/* Glisser au doigt : suit le doigt 1:1, vitesse moyennée sur les 80 dernières ms */
const stage = $("#stage"), W = 170;                      // px de glissement par carte
let sx = 0, spos = 0, samples = [], moved = false, downCard = null;
stage.addEventListener("pointerdown", e => {
  dragging = true; moved = false; sx = e.clientX; spos = pos; target = pos; samples = [[performance.now(), e.clientX]];
  downCard = e.target.closest(".card");
  stage.setPointerCapture(e.pointerId); kick();
});
stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - sx; if (Math.abs(dx) > 6) moved = true;
  pos = spos - dx / W;
  const now = performance.now(); samples.push([now, e.clientX]); while (samples.length > 2 && now - samples[0][0] > 80) samples.shift();
});
const up = () => {
  if (!dragging) return; dragging = false;
  if (moved){
    const [t0, x0] = samples[0], [t1, x1] = samples[samples.length - 1];
    const v = (x1 - x0) / Math.max(16, t1 - t0) / W * 1000;            // cartes par seconde
    const proj = Math.max(-1.6, Math.min(1.6, -v * .18));              // élan : au plus ~2 cartes
    target = Math.round(pos + proj);
  } else if (downCard){
    const i = +downCard.dataset.i; let off = i - pos; off = ((off + N / 2) % N + N) % N - N / 2;
    if (Math.abs(off) < .5){ target = Math.round(pos); toast("Ouvrirait " + FAVS[i].n); if (navigator.vibrate) navigator.vibrate(8); }
    else target = Math.round(pos + off);
  } else target = Math.round(pos);
  kick();
};
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
dots.forEach((b, i) => b.addEventListener("click", () => { let off = i - wrap(Math.round(pos)); if (off > N / 2) off -= N; if (off < -N / 2) off += N; target = Math.round(pos) + off; kick(); }));

/* Inclinaison du téléphone */
let base = null;
addEventListener("deviceorientation", e => {
  if (e.beta == null) return;
  if (!base) base = { b:e.beta, g:e.gamma };
  base.b += (e.beta - base.b) * .004; base.g += (e.gamma - base.g) * .004;
  tgx = Math.max(-12, Math.min(12, (e.gamma - base.g) * .6));
  tgy = Math.max(-8, Math.min(8, -(e.beta - base.b) * .45));
  kick();
}, { passive:true });
layout();
</script>
</body>
</html>
